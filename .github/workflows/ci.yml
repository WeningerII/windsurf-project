name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
  workflow_dispatch:

# Default the GITHUB_TOKEN to read-only; jobs that need more (the Netlify
# deploy comments/statuses) opt in with job-level permissions.
permissions:
  contents: read

# One pipeline per ref. PR pushes cancel the superseded run; pushes to
# main/develop never cancel an in-flight deploy.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      # Pins the browser directory explicitly rather than relying on
      # playwright-core's platform-dependent default, so the cache path and the
      # install location are the SAME value and cannot drift apart. The first
      # version of this cache hardcoded `~/.ms-playwright`, which is not the
      # Linux default (`$XDG_CACHE_HOME/ms-playwright`, i.e.
      # `~/.cache/ms-playwright`) and therefore never existed: the restore could
      # not hit and the save had nothing to write, so it finished in 0s while two
      # runs re-downloaded 380 MiB of browsers looking correctly cached.
      #
      # Written into $GITHUB_ENV from a STEP, not declared in a job-level `env:`.
      # The `runner` context is not available to `jobs.<id>.env` — only inside
      # steps, once a runner is assigned — and using it there does not fail at
      # runtime, it fails to COMPILE the workflow: GitHub emits a run with zero
      # jobs, named after the file path instead of the workflow, so nothing in
      # the PR checks list even appears. That is what runs 30385270683 and
      # 30385653756 are.
      #
      # $RUNNER_TEMP keeps the 380 MiB outside the workspace, which matters
      # beyond tidiness: `check:secret-exposure` walks the repo tree and has no
      # skip entry for a browser directory.
      #
      # The version key is the resolved @playwright/test version, not the
      # lockfile hash: that package pins the browser revision, so a stale-key
      # restore is the one way this cache could hide a real failure.
      - name: Resolve Playwright version and browser path
        id: pw
        run: |
          echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/pw-browsers" >> "$GITHUB_ENV"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}

      # No --with-deps. It apt-installs 9 packages on ubuntu-latest and every
      # one of them is a font (measured: 18.4s of the 30.6s step, "0 upgraded,
      # 9 newly installed", zero shared libraries). The runner image already
      # carries everything Chromium and Firefox link against. No spec in e2e/
      # uses toHaveScreenshot or toMatchSnapshot, so the only thing the missing
      # CJK/Thai fonts can affect is glyph rendering inside failure screenshots,
      # never a DOM or text assertion. Restore --with-deps if a pixel-comparison
      # assertion is ever added.
      - name: Install Playwright browsers
        run: npx playwright install chromium firefox

      # A cache that silently does nothing is the exact failure this one already
      # had once, and it cost nothing visible — the step was green, the post-job
      # save took 0s, and the browsers were re-downloaded every run. Assert the
      # directory the cache is pointed at actually holds browsers, and print the
      # hit/miss so a regression shows up in the log instead of only in the
      # wall clock. A miss is legitimate (version bump, first run after a key
      # change); an EMPTY path after install is not.
      - name: Verify the browser cache is doing something
        run: |
          echo "cache-hit: ${{ steps.pw-cache.outputs.cache-hit || 'false' }}"
          echo "path:      $PLAYWRIGHT_BROWSERS_PATH"
          if [ ! -d "$PLAYWRIGHT_BROWSERS_PATH" ] || [ -z "$(ls -A "$PLAYWRIGHT_BROWSERS_PATH" 2>/dev/null)" ]; then
            echo "::error::PLAYWRIGHT_BROWSERS_PATH is empty or missing after install — the cache path and the install path have drifted, so nothing is being cached."
            exit 1
          fi
          du -sh "$PLAYWRIGHT_BROWSERS_PATH"

      - name: Run full verification suite
        # Skips the duplicate `tsc && vite build` inside Playwright's webServer:
        # `npm run build` already ran earlier in this same chain and
        # check:bundle-size gated that dist. See playwright.config.ts.
        env:
          PLAYWRIGHT_PREBUILT: '1'
        run: npm run verify

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: warn
          retention-days: 7
      
      - name: Upload coverage
        uses: codecov/codecov-action@v5
        if: success()
        with:
          files: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 7
      
      - name: Upload Playwright traces and media
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: warn
          retention-days: 7

  # The flag-on half of the Phase-4 acceptance. `e2e/scene-drag.spec.ts` opens
  # with `test.skip(!FLAG_ON)` and NOTHING set the flag, so from the day it was
  # written until 2026-07-28 it was a keystone acceptance that could not fail —
  # every run reported it skipped and every run was green.
  #
  # The first execution failed, on a real shipped defect: with a scene open the
  # Dock kept whatever system it had (the default first-registered one), so
  # dragging a monster into a scene of a different system silently did nothing.
  # See src/App.tsx `activeSystemId`. That is the entire argument for this job:
  # a gate nobody runs is not a gate.
  #
  # Separate job rather than a step in `verify`, because the flag is a BUILD
  # input — the drag provider is tree-shaken out of a flag-off bundle — so this
  # needs its own dist, and `verify`'s dist is the one the deploy jobs consume.
  # It runs in parallel and does not extend the pipeline's critical path.
  scene-drag:
    name: Scene drag (flag-on e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Same pinned-path + version-keyed cache as `verify`; see the long note
      # there for why the path is written from a step and asserted afterwards.
      - name: Resolve Playwright version and browser path
        id: pw
        run: |
          echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/pw-browsers" >> "$GITHUB_ENV"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}

      # chromium only: this job proves one flag-gated interaction, not
      # cross-browser parity, and firefox would double the install for nothing.
      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Verify the browser cache is doing something
        run: |
          echo "cache-hit: ${{ steps.pw-cache.outputs.cache-hit || 'false' }}"
          if [ ! -d "$PLAYWRIGHT_BROWSERS_PATH" ] || [ -z "$(ls -A "$PLAYWRIGHT_BROWSERS_PATH" 2>/dev/null)" ]; then
            echo "::error::PLAYWRIGHT_BROWSERS_PATH is empty or missing after install."
            exit 1
          fi

      - name: Build with the scene-drag flag on
        env:
          VITE_SCENE_DRAG_ENABLED: 'true'
        run: npm run build

      # The env var is needed TWICE and for different reasons: at build time
      # Vite inlines it into the bundle, and at test time the spec's own
      # `test.skip` guard reads process.env. PLAYWRIGHT_PREBUILT=1 makes the
      # webServer serve the dist just built instead of rebuilding it flag-off.
      - name: Run the flag-on acceptance
        env:
          VITE_SCENE_DRAG_ENABLED: 'true'
          PLAYWRIGHT_PREBUILT: '1'
          PLAYWRIGHT_JSON_OUTPUT_NAME: scene-drag-report.json
        run: npx playwright test e2e/scene-drag.spec.ts --project=chromium --reporter=list,json

      # The failure mode this job exists to end is a green run that proved
      # nothing, so do not trust the exit code alone — a fully skipped file also
      # exits 0. If the env var the spec reads is ever renamed on one side only,
      # the skip silently comes back; this turns that into a red check.
      #
      # (A deleted or renamed spec is already covered: Playwright errors out
      # when a path filter matches no test file.)
      - name: Assert the acceptance was not skipped
        if: always()
        run: |
          node -e '
            const report = require("./scene-drag-report.json");
            const specs = [];
            const walk = (suite) => {
              specs.push(...(suite.specs ?? []));
              (suite.suites ?? []).forEach(walk);
            };
            (report.suites ?? []).forEach(walk);
            const results = specs.flatMap((spec) =>
              spec.tests.flatMap((test) => test.results.map((r) => r.status))
            );
            console.log(`${specs.length} spec(s): ${results.join(", ") || "none"}`);
            const skipped = results.filter((s) => s === "skipped").length;
            if (specs.length === 0 || skipped > 0) {
              console.error(
                `::error::scene-drag acceptance did not execute (${specs.length} specs, ${skipped} skipped). ` +
                  "VITE_SCENE_DRAG_ENABLED is set by this job, so a skip means the spec no longer reads it."
              );
              process.exit(1);
            }
          '

      - name: Upload Playwright traces and media
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-scene-drag
          path: test-results/
          if-no-files-found: warn
          retention-days: 7

  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    needs: [verify]
    # Fork PRs do not receive the Netlify secrets, so a deploy attempt would
    # be a guaranteed red check. Only deploy previews for same-repo PRs.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: write
      statuses: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Deploy to Netlify (Preview)
        uses: nwtgck/actions-netlify@v2
        with:
          publish-dir: './dist'
          # Apply netlify.toml (headers, redirects, caching rules) to API
          # deploys; without this the action ships dist/ with no config.
          netlify-config-path: ./netlify.toml
          production-deploy: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy from GitHub Actions"
          # Commit comments need `contents: write`; the PR comment and commit
          # status carry the same signal under the read-only token.
          enable-commit-comment: false
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: [verify]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: write
      statuses: write

    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Deploy to Netlify (Production)
        uses: nwtgck/actions-netlify@v2
        with:
          publish-dir: './dist'
          # Apply netlify.toml (headers, redirects, caching rules) to API
          # deploys; without this the action ships dist/ with no config.
          netlify-config-path: ./netlify.toml
          production-deploy: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Production deploy from GitHub Actions"
          # Commit comments need `contents: write`; the commit status carries
          # the same signal under the read-only token.
          enable-commit-comment: false
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
